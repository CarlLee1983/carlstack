<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">CarlStack 內容發布管線</title>
  <desc id="desc">Markdown 與 MDX 經過內容 schema、Astro 靜態建置與 Pagefind 索引後部署至 GitHub Pages。</desc>
  <rect width="960" height="540" rx="24" fill="#eef3f8"/>
  <g fill="none" stroke="#315eb7" stroke-width="6">
    <path d="M190 270h96m132 0h96m132 0h96"/>
    <path d="m270 252 18 18-18 18m228-36 18 18-18 18m228-36 18 18-18 18"/>
  </g>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <g><rect x="48" y="190" width="142" height="160" rx="12" fill="#152239"/><text x="119" y="258" fill="#eef3f8" font-size="24" font-weight="700">Markdown</text><text x="119" y="294" fill="#9cb8ef" font-size="20">MDX</text></g>
    <g><rect x="288" y="190" width="130" height="160" rx="12" fill="#dce6f1" stroke="#94a6ba"/><text x="353" y="258" fill="#152239" font-size="23" font-weight="700">Schema</text><text x="353" y="294" fill="#455a72" font-size="19">validation</text></g>
    <g><rect x="516" y="190" width="130" height="160" rx="12" fill="#dce6f1" stroke="#94a6ba"/><text x="581" y="258" fill="#152239" font-size="23" font-weight="700">Astro</text><text x="581" y="294" fill="#455a72" font-size="19">static build</text></g>
    <g><rect x="744" y="190" width="168" height="160" rx="12" fill="#315eb7"/><text x="828" y="248" fill="#f4f7fb" font-size="22" font-weight="700">Pagefind</text><text x="828" y="282" fill="#dce7fb" font-size="18">+</text><text x="828" y="316" fill="#f4f7fb" font-size="19">GitHub Pages</text></g>
  </g>
</svg>
